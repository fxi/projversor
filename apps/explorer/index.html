<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>projversor · explorer</title>
    <meta
      name="description"
      content="Ocean, weather and climate data on a sphere that morphs between world projections." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="projversor" />
    <meta property="og:title" content="projversor · explorer" />
    <meta
      property="og:description"
      content="Ocean, weather and climate data on a sphere that morphs between world projections." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <main class="stage" data-ref="stage">
        <p class="credits">
          <span data-ref="projectionName"></span>
          // Render: zartigl // Data:
          <span data-ref="provider"></span>
        </p>
        <p class="status" data-ref="status" role="status"></p>
        <div
          class="tools"
          data-ref="tools"
          role="toolbar"
          aria-label="Map settings"></div>
        <div class="map-controls">
          <button
            type="button"
            class="round"
            data-ref="zoomIn"
            aria-label="Zoom in">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path d="M5 12h14M12 5v14" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="zoomOut"
            aria-label="Zoom out">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path d="M5 12h14" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="rotateLeft"
            aria-label="Rotate left">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path
                  d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="rotateRight"
            aria-label="Rotate right">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path
                  d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round compass"
            data-ref="compass"
            aria-pressed="true"
            aria-label="North up, locked">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g data-ref="needle">
                <text x="24" y="17" text-anchor="middle">N</text>
                <path d="M24 20 31 35 24 31 17 35Z" />
                <circle class="knob" cx="24" cy="3.5" r="2.5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round play"
            data-ref="play"
            aria-label="Pause">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path class="icon-play" d="M19 14.5 35 24 19 33.5Z" />
              <path class="icon-pause" d="M17 15h5v18h-5zM26 15h5v18h-5z" />
            </svg>
          </button>
        </div>
      </main>

      <header class="clock">
        <div class="date" data-ref="date"></div>
        <div class="hour" data-ref="hour"></div>
      </header>

      <aside class="rail">
        <section class="cell timeline">
          <div class="track">
            <input
              data-ref="time"
              type="range"
              min="0"
              max="1"
              step="0.001"
              value="0"
              aria-label="Time" />
            <ol class="days" data-ref="days"></ol>
          </div>
        </section>
        <section class="cell controls">
          <select class="picker" data-ref="month" aria-label="Month"></select>
          <select
            class="picker"
            data-ref="speed"
            aria-label="Playback speed"></select>
        </section>
        <section class="cell legend">
          <div class="scale">
            <div class="ramp" data-ref="ramp"></div>
            <ol class="ticks" data-ref="ticks"></ol>
          </div>
          <div class="unit" data-ref="unit"></div>
          <div class="speed-key" data-ref="speedKey" hidden>
            <div class="speed-bar"></div>
            <div class="speed-labels">
              <span>0</span>
              <span data-ref="speedMax"></span>
            </div>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
