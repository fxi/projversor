server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output of each demo.
  location ~ ^/((story|site|minimal)/)?assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /story/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /story/index.html;
  }

  # The site reads its content (content/) at runtime: never cached.
  location /site/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /site/index.html;
  }

  location /minimal/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /minimal/index.html;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
