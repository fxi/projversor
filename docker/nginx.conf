# Whole nginx config, replacing the image's /etc/nginx/nginx.conf.
# Runs as the unprivileged "nginx" user: no `user` directive,
# and the pid file and temp files go to /tmp, the only writable place.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build output of each demo.
    location ~ ^/((story|minimal|compare)/)?assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /story/ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /story/index.html;
    }

    location /minimal/ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /minimal/index.html;
    }

    location /compare/ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /compare/index.html;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
