# Run from this folder; the build context is the parent folder, which must
# also hold zartigl (as in MapX submodules/).
services:
  projversor:
    build:
      context: ..
      dockerfile: projversor/Dockerfile
    image: ghcr.io/fxi/projversor:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
