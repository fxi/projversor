name: Publish demo image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # zartigl is built beside projversor (file:../zartigl); the ZARTIGL_REF
  # repository variable picks another branch or tag than main.
  ZARTIGL_REF: ${{ vars.ZARTIGL_REF || 'main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: projversor

      - uses: actions/checkout@v4
        with:
          repository: fxi/zartigl
          ref: ${{ env.ZARTIGL_REF }}
          path: zartigl

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/projversor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The context holds both repositories; Dockerfile.dockerignore
      # (next to the Dockerfile) keeps it to their sources.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: projversor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
