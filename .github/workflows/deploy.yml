name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Bases match https://<owner>.github.io/projversor/: the explorer at
      # the root, the other demos in their folders.
      - run: npm run build:demos
      - run: |
          mkdir -p dist-pages
          cp -R dist-projection/. dist-pages/
          for demo in story site minimal; do
            mkdir -p "dist-pages/$demo"
            cp -R "dist-$demo/." "dist-pages/$demo/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
