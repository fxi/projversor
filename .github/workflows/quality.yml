name: Code quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Browser tests stay local: they need Chrome, live archives and the
      # macOS baselines (tests/browser/README.md).
      - run: npm run quality
      - run: npm test
      - run: npm run build:lib
      - run: npm run build:apps
